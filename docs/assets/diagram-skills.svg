  <!-- install strip -->
  <rect class="card" x="55" y="796" width="1490" height="124" rx="14"/>
  <text class="stripTitle" x="79" y="828">Where skills live 技能安装位置</text>
  <text class="stripText" x="79" y="852">nine skills, one folder each 九个技能各占一个目录</text>
  <text class="stripMono mono" x="79" y="874">skills/&lt;name&gt;/SKILL.md</text>
  <text class="stripSmall" x="79" y="898">plain Markdown · no runtime · no dependencies 纯文档，零运行时依赖</text>

  <path d="M620 812 V 904" stroke="#EFE8DE" stroke-width="1.2"/>
  <text class="stripTitle" x="644" y="828">How to install 安装方式</text>
  <text class="stripText" x="644" y="852">Copy into the game repo 复制到游戏工程：</text>
  <text class="stripMono mono" x="644" y="874">&lt;game-repo&gt;/.agents/skills/&lt;name&gt;/</text>
  <text class="stripSmall" x="644" y="898">also .claude/skills · .dsh/skills · .opencode/skills</text>

  <path d="M1120 812 V 904" stroke="#EFE8DE" stroke-width="1.2"/>
  <rect class="chip" x="1144" y="806" width="377" height="34" rx="9"/>
  <text class="stripMono mono" x="1160" y="828">node scripts/install-skills.mjs --target &lt;game-repo&gt;</text>
  <text class="stripSmall" x="1144" y="862">agent sessions load them automatically 会话自动加载 —— no runtime effect 不影响运行时</text>
  <text class="stripSmall" x="1144" y="884">optional --dir .agents/skills · --force overwrites 可选参数</text>
  <text class="stripSmall" x="1144" y="906">zero dependencies · MIT · works on Windows, macOS, Linux 跨平台</text>
