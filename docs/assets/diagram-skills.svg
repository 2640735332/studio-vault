  <title id="dg4t">Skills map: nine portable skills and the three targets they operate on</title>
  <desc id="dg4d">Nine skill cards in a three by three grid — studio-workspace, studio-brief, studio-shared-repo, studio-spec, studio-spec-pipeline, studio-bug, studio-bugfix, studio-orchestration and studio-vault — mapped to the game repo, the game shared repo and the Vault service, with installation instructions.</desc>
